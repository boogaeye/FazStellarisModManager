name: Build and test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FazStellarisModmanager.sln

      - name: Build
        run: dotnet build FazStellarisModmanager.sln -c Release --no-restore

      - name: Test
        run: dotnet test FazStellarisModmanager.Tests -c Release --no-build
